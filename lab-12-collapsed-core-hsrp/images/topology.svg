<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="600" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2328">Collapsed Core: EtherChannel + HSRP</text>
  <text x="380" y="54" text-anchor="middle" font-size="12" fill="#57606a">Routed core link · dual-homed access switches · HSRP and STP root split per VLAN</text>

  <!-- core routed Po1 -->
  <line x1="260" y1="134" x2="500" y2="134" stroke="#1f2328" stroke-width="3"/>
  <line x1="260" y1="146" x2="500" y2="146" stroke="#1f2328" stroke-width="3"/>
  <ellipse cx="300" cy="140" rx="9" ry="16" fill="none" stroke="#1f2328" stroke-width="2"/>
  <ellipse cx="460" cy="140" rx="9" ry="16" fill="none" stroke="#1f2328" stroke-width="2"/>
  <text x="380" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2328">Po1 · routed LACP · Fa0/1-2</text>
  <text x="380" y="166" text-anchor="middle" font-size="11" fill="#1f2328">10.0.0.1/30 ↔ 10.0.0.2/30</text>

  <!-- downlinks: DSW1 -> SW1 (Po2), DSW1 -> SW2 (Po3), DSW2 -> SW1 (Po2), DSW2 -> SW2 (Po3) -->
  <g stroke-width="3">
    <line x1="190" y1="164" x2="190" y2="378" stroke="#1a7f37"/><line x1="202" y1="164" x2="202" y2="378" stroke="#1a7f37"/>
    <line x1="238" y1="164" x2="530" y2="378" stroke="#1a7f37"/><line x1="248" y1="160" x2="540" y2="374" stroke="#1a7f37"/>
    <line x1="512" y1="160" x2="220" y2="374" stroke="#0969da"/><line x1="522" y1="164" x2="230" y2="378" stroke="#0969da"/>
    <line x1="558" y1="164" x2="558" y2="378" stroke="#0969da"/><line x1="570" y1="164" x2="570" y2="378" stroke="#0969da"/>
  </g>
  <rect x="226" y="208" width="308" height="50" rx="4" fill="#ffffff" opacity="0.92"/>
  <g font-size="11">
    <text x="182" y="240" text-anchor="end" fill="#1a7f37">DSW1 Po2</text>
    <text x="182" y="254" text-anchor="end" fill="#1a7f37">Fa0/3-4 ↔ SW1 Fa0/1-2</text>
    <text x="578" y="240" fill="#0969da">DSW2 Po3</text>
    <text x="578" y="254" fill="#0969da">Fa0/5-6 ↔ SW2 Fa0/3-4</text>
    <text x="380" y="222" text-anchor="middle" fill="#57606a">DSW1 Po3 (Fa0/5-6 ↔ SW2 Fa0/1-2)</text>
    <text x="380" y="236" text-anchor="middle" fill="#57606a">DSW2 Po2 (Fa0/3-4 ↔ SW1 Fa0/3-4)</text>
    <text x="380" y="250" text-anchor="middle" fill="#57606a">all downlinks: LACP trunks, core active ↔ access passive</text>
  </g>

  <!-- core switches -->
  <rect x="140" y="112" width="120" height="52" rx="6" fill="#1a7f37"/>
  <text x="200" y="144" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">DSW1</text>
  <rect x="500" y="112" width="120" height="52" rx="6" fill="#0969da"/>
  <text x="560" y="144" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">DSW2</text>
  <g font-size="11" text-anchor="middle">
    <text x="200" y="76" font-weight="bold" fill="#1a7f37">VLAN 10: HSRP Active (110) · STP root</text>
    <text x="200" y="90" fill="#57606a">VLAN 20: HSRP Standby (90) · backup root</text>
    <text x="200" y="104" fill="#57606a">WS-C3560-24TS · .10.2 / .20.2</text>
    <text x="560" y="76" font-weight="bold" fill="#0969da">VLAN 20: HSRP Active (110) · STP root</text>
    <text x="560" y="90" fill="#57606a">VLAN 10: HSRP Standby (90) · backup root</text>
    <text x="560" y="104" fill="#57606a">WS-C3560-24TS · .10.3 / .20.3</text>
  </g>

  <!-- access switches -->
  <g font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <rect x="150" y="378" width="120" height="44" rx="6" fill="#57606a"/><text x="210" y="406">SW1</text>
    <rect x="490" y="378" width="120" height="44" rx="6" fill="#57606a"/><text x="550" y="406">SW2</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#57606a">
    <text x="210" y="438">WS-C2960-24TT-L · Po1 → DSW1, Po2 → DSW2</text>
    <text x="550" y="438">WS-C2960-24TT-L · Po1 → DSW1, Po2 → DSW2</text>
  </g>

  <!-- PCs -->
  <g stroke="#57606a" stroke-width="2"><line x1="210" y1="444" x2="210" y2="480"/><line x1="550" y1="444" x2="550" y2="480"/></g>
  <g font-size="11" fill="#57606a"><text x="218" y="466">Fa0/10</text><text x="558" y="466">Fa0/10</text></g>
  <g fill="#f6f8fa" stroke="#57606a" stroke-width="2"><rect x="180" y="480" width="60" height="40" rx="4"/><rect x="520" y="480" width="60" height="40" rx="4"/></g>
  <g text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328"><text x="210" y="505">PC1</text><text x="550" y="505">PC2</text></g>
  <g text-anchor="middle" font-size="11" fill="#1f2328"><text x="210" y="538">VLAN 10 · 192.168.10.10</text><text x="550" y="538">VLAN 20 · 192.168.20.10</text></g>
  <g text-anchor="middle" font-size="11" fill="#57606a"><text x="210" y="553">gw 192.168.10.1 (HSRP VIP)</text><text x="550" y="553">gw 192.168.20.1 (HSRP VIP)</text></g>

  <text x="380" y="584" text-anchor="middle" font-size="11" fill="#57606a">Observed: DSW1 powered off → DSW2 Active for both VLANs; DSW1 back → preempts VLAN 10 · STP still blocks one downlink per VLAN</text>
</svg>
