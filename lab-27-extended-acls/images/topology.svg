<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="470" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2328">Extended ACLs</text>
  <text x="380" y="54" text-anchor="middle" font-size="12" fill="#57606a">Named ACL PROTECT_SRV inbound on R1 Gi0/0, close to the source: PC2 can't reach SRV1, everything else can</text>

  <!-- subnet shading -->
  <rect x="30" y="80" width="360" height="320" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-dasharray="6 4"/>
  <text x="46" y="100" font-size="12" font-weight="bold" fill="#0969da">User LAN · 192.168.10.0/24</text>
  <rect x="470" y="80" width="260" height="320" rx="10" fill="#dafbe1" stroke="#4ac26b" stroke-dasharray="6 4"/>
  <text x="714" y="100" text-anchor="end" font-size="12" font-weight="bold" fill="#1a7f37">Server LAN · 172.16.0.0/24</text>

  <!-- R1 -->
  <rect x="320" y="130" width="120" height="50" rx="25" fill="#8250df"/>
  <text x="380" y="161" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">R1</text>
  <text x="380" y="122" text-anchor="middle" font-size="11" fill="#57606a">ISR4331</text>

  <!-- R1 to SRV1 -->
  <line x1="440" y1="155" x2="570" y2="155" stroke="#1f2328" stroke-width="3"/>
  <text x="448" y="146" font-size="11" font-weight="bold" fill="#1a7f37">Gi0/1 172.16.0.1</text>
  <text x="562" y="174" text-anchor="end" font-size="11" fill="#57606a">Fa0</text>
  <rect x="570" y="135" width="70" height="40" rx="4" fill="#f6f8fa" stroke="#57606a" stroke-width="2"/>
  <text x="605" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">SRV1</text>
  <text x="605" y="194" text-anchor="middle" font-size="11" fill="#1f2328">172.16.0.10/24</text>
  <text x="605" y="209" text-anchor="middle" font-size="11" fill="#57606a">gw 172.16.0.1</text>

  <!-- R1 to SW1 -->
  <line x1="350" y1="180" x2="230" y2="250" stroke="#1f2328" stroke-width="3"/>
  <text x="318" y="230" font-size="11" font-weight="bold" fill="#0969da">Gi0/0 192.168.10.1</text>
  <text x="222" y="246" text-anchor="end" font-size="11" fill="#57606a">Gi0/1</text>

  <!-- ACL marker on Gi0/0 inbound -->
  <circle cx="322" cy="196" r="11" fill="#cf222e"/>
  <text x="322" y="200" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">IN</text>
  <rect x="80" y="122" width="210" height="58" rx="6" fill="#ffffff" stroke="#cf222e" stroke-width="1.5"/>
  <g font-family="Menlo, Consolas, monospace" font-size="10">
    <text x="90" y="138" font-weight="bold" fill="#cf222e">PROTECT_SRV (Gi0/0 in)</text>
    <text x="90" y="153" fill="#cf222e">10 deny ip host .10.12 host 172.16.0.10</text>
    <text x="90" y="168" fill="#1a7f37">20 permit ip any any</text>
  </g>

  <!-- SW1 -->
  <rect x="170" y="250" width="120" height="44" rx="6" fill="#57606a"/>
  <text x="230" y="278" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">SW1</text>
  <text x="300" y="276" font-size="11" fill="#57606a">2960 · factory default</text>

  <!-- PC links -->
  <g stroke="#57606a" stroke-width="2">
    <line x1="195" y1="294" x2="130" y2="330"/>
    <line x1="265" y1="294" x2="330" y2="330"/>
  </g>
  <g font-size="11" fill="#57606a">
    <text x="150" y="306" text-anchor="end">Fa0/1</text>
    <text x="310" y="306">Fa0/2</text>
  </g>

  <!-- PCs -->
  <g fill="#f6f8fa" stroke="#57606a" stroke-width="2">
    <rect x="100" y="330" width="60" height="36" rx="4"/>
    <rect x="300" y="330" width="60" height="36" rx="4" stroke="#cf222e"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">
    <text x="130" y="353">PC1</text><text x="330" y="353">PC2</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#1f2328">
    <text x="130" y="382">192.168.10.11/24</text><text x="330" y="382">192.168.10.12/24</text>
  </g>

  <g font-size="12" font-weight="bold" text-anchor="middle">
    <text x="380" y="428" fill="#1a7f37">Observed: PC1 → SRV1 4/4 (TTL 127) · PC2 → 172.16.0.1 4/4 (TTL 255)</text>
    <text x="380" y="448" fill="#cf222e">Observed: PC2 → SRV1 0/4 · "Destination net unreachable" from 192.168.10.1</text>
  </g>
</svg>
