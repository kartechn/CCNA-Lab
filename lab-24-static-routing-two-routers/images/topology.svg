<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="460" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2328">Static Routing: Two Routers</text>
  <text x="380" y="54" text-anchor="middle" font-size="12" fill="#57606a">Each router learns the far LAN from one static route across a /30 transit link</text>

  <!-- subnet shading -->
  <rect x="30" y="200" width="300" height="200" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-dasharray="6 4"/>
  <text x="46" y="388" font-size="12" font-weight="bold" fill="#0969da">LAN 1 · 192.168.1.0/24</text>
  <rect x="430" y="200" width="300" height="200" rx="10" fill="#dafbe1" stroke="#4ac26b" stroke-dasharray="6 4"/>
  <text x="714" y="388" text-anchor="end" font-size="12" font-weight="bold" fill="#1a7f37">LAN 2 · 192.168.2.0/24</text>

  <!-- transit link -->
  <line x1="240" y1="110" x2="520" y2="110" stroke="#bc4c00" stroke-width="3"/>
  <text x="380" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#bc4c00">Transit 10.0.0.0/30</text>
  <g font-size="11" fill="#bc4c00">
    <text x="248" y="128">Gi0/1 .1</text>
    <text x="512" y="128" text-anchor="end">Gi0/1 .2</text>
  </g>

  <!-- routers -->
  <rect x="120" y="85" width="120" height="50" rx="25" fill="#8250df"/>
  <text x="180" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">R1</text>
  <rect x="520" y="85" width="120" height="50" rx="25" fill="#8250df"/>
  <text x="580" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">R2</text>
  <g font-size="10" fill="#8250df" font-family="Menlo, Consolas, monospace" text-anchor="middle">
    <text x="180" y="155">ip route 192.168.2.0 /24 → 10.0.0.2</text>
    <text x="580" y="155">ip route 192.168.1.0 /24 → 10.0.0.1</text>
  </g>

  <!-- router to switch -->
  <line x1="180" y1="135" x2="180" y2="240" stroke="#1f2328" stroke-width="3"/>
  <line x1="580" y1="135" x2="580" y2="240" stroke="#1f2328" stroke-width="3"/>
  <g font-size="11">
    <text x="188" y="185" font-weight="bold" fill="#0969da">Gi0/0 192.168.1.1</text>
    <text x="572" y="185" text-anchor="end" font-weight="bold" fill="#1a7f37">Gi0/0 192.168.2.1</text>
    <text x="188" y="235" fill="#57606a">Gi0/1</text>
    <text x="572" y="235" text-anchor="end" fill="#57606a">Gi0/1</text>
  </g>

  <!-- switches -->
  <g font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <rect x="120" y="240" width="120" height="44" rx="6" fill="#57606a"/><text x="180" y="268">SW1</text>
    <rect x="520" y="240" width="120" height="44" rx="6" fill="#57606a"/><text x="580" y="268">SW2</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#57606a">
    <text x="150" y="298" text-anchor="start">2960 · factory default</text>
    <text x="610" y="298" text-anchor="end">2960 · factory default</text>
  </g>

  <!-- PC links -->
  <g stroke="#57606a" stroke-width="2">
    <line x1="140" y1="284" x2="100" y2="330"/>
    <line x1="620" y1="284" x2="660" y2="330"/>
  </g>
  <g font-size="11" fill="#57606a">
    <text x="112" y="300" text-anchor="end">Fa0/1</text>
    <text x="648" y="300">Fa0/1</text>
  </g>

  <!-- PCs -->
  <g fill="#f6f8fa" stroke="#57606a" stroke-width="2">
    <rect x="70" y="330" width="60" height="34" rx="4"/>
    <rect x="630" y="330" width="60" height="34" rx="4"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">
    <text x="100" y="352">PC1</text><text x="660" y="352">PC2</text>
  </g>
  <g font-size="11" fill="#1f2328">
    <text x="140" y="345">192.168.1.10/24</text>
    <text x="620" y="345" text-anchor="end">192.168.2.10/24</text>
  </g>
  <g font-size="11" fill="#57606a">
    <text x="140" y="360">gw 192.168.1.1</text>
    <text x="620" y="360" text-anchor="end">gw 192.168.2.1</text>
  </g>

  <text x="380" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2328">Observed: PC1 → ping 192.168.2.10 · 4/4 replies · TTL 126 (128 − 2 router hops)</text>
</svg>
