<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="480" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2328">DHCP + NAT/PAT to the Internet</text>
  <text x="380" y="54" text-anchor="middle" font-size="12" fill="#57606a">R1 leases addresses to the LAN and hides them all behind its one public address</text>

  <!-- inside / outside shading -->
  <rect x="30" y="80" width="400" height="330" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-dasharray="6 4"/>
  <text x="46" y="100" font-size="12" font-weight="bold" fill="#0969da">Inside · 192.168.10.0/24 (private)</text>
  <rect x="460" y="80" width="270" height="330" rx="10" fill="#fff1e5" stroke="#fb8f44" stroke-dasharray="6 4"/>
  <text x="714" y="100" text-anchor="end" font-size="12" font-weight="bold" fill="#bc4c00">Outside · simulated internet</text>

  <!-- R1 to ISP -->
  <line x1="390" y1="150" x2="560" y2="150" stroke="#bc4c00" stroke-width="3"/>
  <text x="475" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#bc4c00">203.0.113.0/30</text>
  <g font-size="11" fill="#bc4c00">
    <text x="396" y="170">Gi0/1 .1</text>
    <text x="554" y="170" text-anchor="end">Gi0/1 .2</text>
  </g>
  <text x="396" y="186" font-size="10" font-weight="bold" fill="#bc4c00">nat outside</text>

  <!-- routers -->
  <rect x="270" y="125" width="120" height="50" rx="25" fill="#8250df"/>
  <text x="330" y="156" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">R1</text>
  <rect x="560" y="125" width="120" height="50" rx="25" fill="#57606a"/>
  <text x="620" y="156" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">ISP</text>
  <g font-size="10" fill="#8250df" text-anchor="end">
    <text x="262" y="138">DHCP pool LAN (.11 – .254)</text>
    <text x="262" y="152">PAT → 203.0.113.1</text>
    <text x="262" y="166">default route → 203.0.113.2</text>
  </g>

  <!-- ISP loopback -->
  <line x1="620" y1="175" x2="620" y2="250" stroke="#57606a" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="565" y="250" width="110" height="40" rx="6" fill="#ffffff" stroke="#bc4c00" stroke-width="2"/>
  <text x="620" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2328">Loopback0</text>
  <text x="620" y="283" text-anchor="middle" font-size="11" fill="#bc4c00">8.8.8.8/32</text>
  <text x="620" y="310" text-anchor="middle" font-size="10" fill="#57606a">no route to 192.168.10.0/24</text>

  <!-- R1 to SW1 -->
  <line x1="330" y1="175" x2="230" y2="250" stroke="#1f2328" stroke-width="3"/>
  <text x="290" y="226" font-size="11" font-weight="bold" fill="#0969da">Gi0/0 192.168.10.1</text>
  <text x="290" y="240" font-size="10" font-weight="bold" fill="#0969da">nat inside</text>
  <text x="222" y="244" text-anchor="end" font-size="11" fill="#57606a">Gi0/1</text>

  <!-- SW1 -->
  <rect x="170" y="250" width="120" height="44" rx="6" fill="#57606a"/>
  <text x="230" y="278" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">SW1</text>
  <text x="300" y="276" font-size="11" fill="#57606a">2960 · factory default</text>

  <!-- PC links -->
  <g stroke="#57606a" stroke-width="2">
    <line x1="195" y1="294" x2="130" y2="340"/>
    <line x1="265" y1="294" x2="330" y2="340"/>
  </g>
  <g font-size="11" fill="#57606a">
    <text x="152" y="314" text-anchor="end">Fa0/1</text>
    <text x="308" y="314">Fa0/2</text>
  </g>

  <!-- PCs -->
  <g fill="#f6f8fa" stroke="#57606a" stroke-width="2">
    <rect x="100" y="340" width="60" height="36" rx="4"/>
    <rect x="300" y="340" width="60" height="36" rx="4"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">
    <text x="130" y="363">PC1</text><text x="330" y="363">PC2</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#1f2328">
    <text x="130" y="392">DHCP → 192.168.10.11</text>
    <text x="330" y="392">DHCP → 192.168.10.12</text>
  </g>

  <text x="380" y="440" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2328">Observed: PC2 → ping 8.8.8.8 · 4/4 replies · TTL 254</text>
  <text x="380" y="458" text-anchor="middle" font-size="11" fill="#57606a">R1 translated 192.168.10.12 → 203.0.113.1 (inside local → inside global)</text>
</svg>
