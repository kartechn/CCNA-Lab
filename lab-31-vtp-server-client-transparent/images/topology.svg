<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="500" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2328">VTP Server, Client and Transparent Modes</text>
  <text x="380" y="54" text-anchor="middle" font-size="12" fill="#57606a">Domain CCNA-LAB · VTP v2 · password Cisco123 · VLAN databases as saved in the export</text>

  <!-- trunks -->
  <g stroke="#8250df" stroke-width="4">
    <line x1="340" y1="152" x2="200" y2="270"/>
    <line x1="420" y1="152" x2="560" y2="270"/>
  </g>
  <g font-size="11" fill="#8250df">
    <text x="252" y="200" text-anchor="end">SW1 Gi0/1 ↔ SW2 Gi0/1</text>
    <text x="252" y="214" text-anchor="end">802.1Q trunk</text>
    <text x="508" y="200">SW1 Gi0/2 ↔ SW3 Gi0/1</text>
    <text x="508" y="214">802.1Q trunk</text>
  </g>

  <!-- VTP advert arrows -->
  <g font-size="10" font-weight="bold" fill="#1a7f37">
    <text x="224" y="244" text-anchor="end">adverts → synced (rev 8)</text>
  </g>
  <g font-size="10" font-weight="bold" fill="#9a6700">
    <text x="536" y="244">adverts → ignored, passed on</text>
  </g>

  <!-- switches -->
  <g font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <rect x="320" y="108" width="120" height="44" rx="6" fill="#1a7f37"/><text x="380" y="136">SW1</text>
    <rect x="140" y="270" width="120" height="44" rx="6" fill="#0969da"/><text x="200" y="298">SW2</text>
    <rect x="500" y="270" width="120" height="44" rx="6" fill="#9a6700"/><text x="560" y="298">SW3</text>
  </g>
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <text x="380" y="96" fill="#1a7f37">VTP server · revision 8</text>
    <text x="200" y="332" fill="#0969da">VTP client · revision 8</text>
    <text x="560" y="332" fill="#9a6700">VTP transparent · revision 0</text>
  </g>

  <!-- VLAN databases -->
  <g font-family="Menlo, Consolas, monospace" font-size="10" fill="#1f2328">
    <rect x="460" y="76" width="150" height="76" rx="6" fill="#dafbe1" stroke="#4ac26b"/>
    <text x="470" y="92" font-weight="bold" fill="#1a7f37">SW1 VLANs (created)</text>
    <text x="470" y="107">10 SALES  20 HR</text>
    <text x="470" y="121">30 IT     99 MGMT</text>
    <text x="470" y="137" fill="#57606a">in vlan.dat only</text>

    <rect x="30" y="344" width="170" height="62" rx="6" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="40" y="360" font-weight="bold" fill="#0969da">SW2 VLANs (learned)</text>
    <text x="40" y="375">10 SALES  20 HR</text>
    <text x="40" y="389">30 IT     99 MGMT</text>

    <rect x="560" y="344" width="170" height="62" rx="6" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="570" y="360" font-weight="bold" fill="#9a6700">SW3 VLANs (local)</text>
    <text x="570" y="375">10 SALES only</text>
    <text x="570" y="389" fill="#57606a">in running-config</text>
  </g>

  <!-- PC links -->
  <g stroke="#57606a" stroke-width="2">
    <line x1="230" y1="314" x2="290" y2="420"/>
    <line x1="530" y1="314" x2="470" y2="420"/>
  </g>
  <g font-size="11" fill="#57606a">
    <text x="272" y="370">Fa0/1 · VLAN 10</text>
    <text x="488" y="370" text-anchor="end">Fa0/1 · VLAN 10</text>
  </g>

  <!-- PCs -->
  <g fill="#f6f8fa" stroke="#57606a" stroke-width="2">
    <rect x="260" y="420" width="60" height="36" rx="4"/>
    <rect x="440" y="420" width="60" height="36" rx="4"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">
    <text x="290" y="443">PC1</text><text x="470" y="443">PC2</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#1f2328">
    <text x="290" y="472">192.168.10.11/24</text><text x="470" y="472">192.168.10.12/24</text>
  </g>

  <text x="380" y="492" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2328">Observed: PC2 → ping 192.168.10.11 · 4/4 · TTL 128 · path SW3 → SW1 → SW2</text>
</svg>
