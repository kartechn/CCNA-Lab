<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="560" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2328">EtherChannel and Inter-VLAN Routing</text>
  <text x="380" y="54" text-anchor="middle" font-size="12" fill="#57606a">Two LACP trunk bundles to a Layer 3 core · observed: Po1(SU), Po2(SU), PC2 → PC1 ping 4/4</text>

  <!-- Po1 DSW1-SW1 -->
  <line x1="322" y1="148" x2="192" y2="290" stroke="#8250df" stroke-width="3"/>
  <line x1="333" y1="155" x2="203" y2="297" stroke="#8250df" stroke-width="3"/>
  <ellipse cx="262" cy="222" rx="9" ry="16" transform="rotate(42 262 222)" fill="none" stroke="#8250df" stroke-width="2"/>
  <text x="236" y="196" text-anchor="end" font-size="12" font-weight="bold" fill="#8250df">Po1 · LACP trunk</text>
  <text x="236" y="212" text-anchor="end" font-size="11" fill="#8250df">DSW1 Fa0/1-2 (active)</text>
  <text x="236" y="226" text-anchor="end" font-size="11" fill="#8250df">↕ SW1 Fa0/1-2 (passive)</text>

  <!-- Po2 DSW1-SW2 -->
  <line x1="427" y1="155" x2="557" y2="297" stroke="#bc4c00" stroke-width="3"/>
  <line x1="438" y1="148" x2="568" y2="290" stroke="#bc4c00" stroke-width="3"/>
  <ellipse cx="498" cy="222" rx="9" ry="16" transform="rotate(-42 498 222)" fill="none" stroke="#bc4c00" stroke-width="2"/>
  <text x="524" y="196" font-size="12" font-weight="bold" fill="#bc4c00">Po2 · LACP trunk</text>
  <text x="524" y="212" font-size="11" fill="#bc4c00">DSW1 Fa0/3-4 (active)</text>
  <text x="524" y="226" font-size="11" fill="#bc4c00">↕ SW2 Fa0/1-2 (passive)</text>

  <!-- DSW1 -->
  <rect x="300" y="100" width="160" height="52" rx="6" fill="#1a7f37"/>
  <text x="380" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">DSW1</text>
  <text x="380" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a7f37">Layer 3 core · ip routing</text>
  <text x="380" y="93" text-anchor="middle" font-size="11" fill="#57606a">WS-C3560-24TS · SVI Vlan10 .10.1 · SVI Vlan20 .20.1</text>

  <!-- access switches -->
  <g font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <rect x="140" y="288" width="120" height="44" rx="6" fill="#57606a"/><text x="200" y="316">SW1</text>
    <rect x="500" y="288" width="120" height="44" rx="6" fill="#57606a"/><text x="560" y="316">SW2</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#57606a">
    <text x="200" y="348">WS-C2960-24TT-L</text><text x="560" y="348">WS-C2960-24TT-L</text>
  </g>

  <!-- PC links -->
  <g stroke="#57606a" stroke-width="2">
    <line x1="200" y1="354" x2="200" y2="420"/><line x1="560" y1="354" x2="560" y2="420"/>
  </g>
  <g font-size="11" fill="#57606a">
    <text x="208" y="392">Fa0/10 · access VLAN 10</text><text x="568" y="392">Fa0/10 · access VLAN 20</text>
  </g>

  <!-- PCs -->
  <g fill="#f6f8fa" stroke="#57606a" stroke-width="2">
    <rect x="170" y="420" width="60" height="40" rx="4"/><rect x="530" y="420" width="60" height="40" rx="4"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">
    <text x="200" y="445">PC1</text><text x="560" y="445">PC2</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#1f2328">
    <text x="200" y="478">192.168.10.10/24</text><text x="560" y="478">192.168.20.10/24</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#57606a">
    <text x="200" y="493">VLAN 10 · gw 192.168.10.1</text><text x="560" y="493">VLAN 20 · gw 192.168.20.1</text>
  </g>

  <text x="380" y="535" text-anchor="middle" font-size="11" fill="#57606a">Traffic between VLANs goes up one bundle, is routed between SVIs on DSW1, and comes down the other</text>
</svg>
