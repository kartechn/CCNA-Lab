<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="380" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2328">Simple Switch Network With VLAN</text>

  <!-- links -->
  <line x1="130" y1="178" x2="335" y2="255" stroke="#0969da" stroke-width="3"/>
  <line x1="630" y1="178" x2="425" y2="255" stroke="#1a7f37" stroke-width="3"/>
  <text x="200" y="232" text-anchor="end" font-size="12" fill="#0969da">PC2 Fa0 ↔ SW1 Gi0/1</text>
  <text x="560" y="232" font-size="12" fill="#1a7f37">SW1 Gi0/2 ↔ PC1 Fa0</text>

  <!-- SW1 -->
  <rect x="320" y="255" width="120" height="44" rx="6" fill="#57606a"/>
  <g stroke="#ffffff" stroke-width="2">
    <line x1="345" y1="270" x2="375" y2="270"/><line x1="385" y1="284" x2="415" y2="284"/>
  </g>
  <path d="M371 265 l6 5 -6 5 M389 279 l-6 5 6 5" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="380" y="320" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2328">SW1</text>
  <text x="380" y="338" text-anchor="middle" font-size="12" fill="#57606a">WS-C2960-24TT-L</text>

  <!-- PC2 (VLAN 10) -->
  <rect x="98" y="78" width="64" height="44" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <rect x="120" y="122" width="20" height="8" fill="#0969da"/>
  <text x="130" y="60" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2328">PC2</text>
  <text x="130" y="150" text-anchor="middle" font-size="12" fill="#1f2328">192.168.20.10/24</text>
  <text x="130" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#0969da">VLAN 10 (Buss)</text>

  <!-- PC1 (VLAN 20) -->
  <rect x="598" y="78" width="64" height="44" rx="4" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
  <rect x="620" y="122" width="20" height="8" fill="#1a7f37"/>
  <text x="630" y="60" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2328">PC1</text>
  <text x="630" y="150" text-anchor="middle" font-size="12" fill="#1f2328">192.168.10.10/24</text>
  <text x="630" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a7f37">VLAN 20 (crew)</text>

  <text x="380" y="366" text-anchor="middle" font-size="11" fill="#57606a">No router or gateway: VLAN 10 and VLAN 20 are isolated</text>
</svg>
