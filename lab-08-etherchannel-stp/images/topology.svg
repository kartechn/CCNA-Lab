<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="560" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2328">STP over EtherChannel</text>
  <text x="380" y="54" text-anchor="middle" font-size="12" fill="#57606a">Observed Rapid-PVST+ roles for VLAN 10 · every bundle is a 2-link LACP trunk (cost 12)</text>

  <!-- Po1 DSW1-DSW2 -->
  <line x1="260" y1="124" x2="500" y2="124" stroke="#8250df" stroke-width="3"/>
  <line x1="260" y1="136" x2="500" y2="136" stroke="#8250df" stroke-width="3"/>
  <ellipse cx="300" cy="130" rx="9" ry="16" fill="none" stroke="#8250df" stroke-width="2"/>
  <ellipse cx="460" cy="130" rx="9" ry="16" fill="none" stroke="#8250df" stroke-width="2"/>
  <text x="380" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#8250df">Po1 · Fa0/1-2 ↔ Fa0/1-2</text>
  <text x="380" y="158" text-anchor="middle" font-size="11" fill="#8250df">DSW1 active ↔ DSW2 passive</text>
  <text x="490" y="150" text-anchor="end" font-size="11" font-weight="bold" fill="#1a7f37">RP</text>

  <!-- Po2 DSW1-SW1 -->
  <line x1="214" y1="152" x2="324" y2="304" stroke="#bc4c00" stroke-width="3"/>
  <line x1="226" y1="152" x2="336" y2="304" stroke="#bc4c00" stroke-width="3"/>
  <ellipse cx="270" cy="228" rx="9" ry="16" transform="rotate(-36 270 228)" fill="none" stroke="#bc4c00" stroke-width="2"/>
  <text x="246" y="246" text-anchor="end" font-size="12" font-weight="bold" fill="#bc4c00">Po2</text>
  <text x="246" y="262" text-anchor="end" font-size="11" fill="#bc4c00">DSW1 Fa0/3-4 (active)</text>
  <text x="246" y="276" text-anchor="end" font-size="11" fill="#bc4c00">↕ SW1 Fa0/1-2 (passive)</text>
  <text x="340" y="296" text-anchor="end" font-size="11" font-weight="bold" fill="#1a7f37">RP</text>

  <!-- Po3 DSW2-SW1 -->
  <line x1="534" y1="152" x2="424" y2="304" stroke="#0969da" stroke-width="3"/>
  <line x1="546" y1="152" x2="436" y2="304" stroke="#0969da" stroke-width="3"/>
  <ellipse cx="490" cy="228" rx="9" ry="16" transform="rotate(36 490 228)" fill="none" stroke="#0969da" stroke-width="2"/>
  <text x="514" y="246" font-size="12" font-weight="bold" fill="#0969da">Po3</text>
  <text x="514" y="262" font-size="11" fill="#0969da">DSW2 Fa0/3-4 (active)</text>
  <text x="514" y="276" font-size="11" fill="#0969da">↕ SW1 Fa0/3-4 (passive)</text>

  <!-- blocked marker at SW1 Po3 -->
  <circle cx="440" cy="288" r="11" fill="#cf222e"/>
  <path d="M434 282 l12 12 M446 282 l-12 12" stroke="#ffffff" stroke-width="2.5"/>
  <text x="456" y="306" font-size="11" font-weight="bold" fill="#cf222e">SW1 Po3 Alternate (BLK)</text>

  <!-- switches -->
  <g font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <rect x="140" y="108" width="120" height="44" rx="6" fill="#1a7f37"/><text x="200" y="136">DSW1</text>
    <rect x="500" y="108" width="120" height="44" rx="6" fill="#0969da"/><text x="560" y="136">DSW2</text>
    <rect x="320" y="304" width="120" height="44" rx="6" fill="#57606a"/><text x="380" y="332">SW1</text>
  </g>
  <text x="200" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a7f37">Root bridge · priority 24576</text>
  <text x="200" y="99" text-anchor="middle" font-size="11" fill="#57606a">WS-C3560-24TS</text>
  <text x="560" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#0969da">Backup root · priority 28672</text>
  <text x="560" y="99" text-anchor="middle" font-size="11" fill="#57606a">WS-C3560-24TS</text>
  <text x="380" y="364" text-anchor="middle" font-size="11" fill="#57606a">WS-C2960-24TT-L · root cost 12 via Po2</text>

  <!-- PC links -->
  <g stroke="#57606a" stroke-width="2">
    <line x1="380" y1="370" x2="380" y2="430"/>
    <line x1="600" y1="152" x2="660" y2="430"/>
  </g>
  <g font-size="11" fill="#57606a">
    <text x="388" y="404">Fa0/10</text><text x="640" y="300">Fa0/10</text>
  </g>

  <!-- PCs -->
  <g fill="#f6f8fa" stroke="#57606a" stroke-width="2">
    <rect x="350" y="430" width="60" height="40" rx="4"/><rect x="630" y="430" width="60" height="40" rx="4"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">
    <text x="380" y="455">PC1</text><text x="660" y="455">PC2</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#1f2328">
    <text x="380" y="488">192.168.10.1/24</text><text x="660" y="488">192.168.10.2/24</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#57606a">
    <text x="380" y="503">VLAN 10</text><text x="660" y="503">VLAN 10</text>
  </g>

  <text x="380" y="538" text-anchor="middle" font-size="11" fill="#57606a">RP = root port · shut Po2 → SW1 Po3 becomes Root FWD (observed) · no shut Po2 → Po3 back to Altn BLK</text>
</svg>
