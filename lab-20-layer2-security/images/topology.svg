<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="640" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2328">Layer 2 Security: BPDU Guard, Port Security, DHCP Snooping</text>
  <text x="380" y="54" text-anchor="middle" font-size="12" fill="#57606a">Three threats on access switch SW1 · baseline state exported (no protections yet)</text>

  <!-- R1 -->
  <rect x="320" y="72" width="120" height="40" rx="20" fill="#8250df"/>
  <text x="380" y="97" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">R1</text>
  <text x="456" y="90" font-size="11" fill="#1f2328">DHCP server (pools VLAN10 / VLAN20)</text>
  <text x="456" y="104" font-size="11" fill="#57606a">ISR4331 · Gi0/0 10.0.0.1/30</text>
  <line x1="380" y1="112" x2="380" y2="150" stroke="#1f2328" stroke-width="4"/>
  <text x="390" y="136" font-size="11" fill="#57606a">routed 10.0.0.0/30</text>

  <!-- DSW1 -->
  <rect x="310" y="150" width="140" height="46" rx="6" fill="#0969da"/>
  <text x="380" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">DSW1</text>
  <g font-size="11" fill="#1f2328">
    <text x="466" y="164">SVIs .1 + ip helper-address 10.0.0.1</text>
    <text x="466" y="178">root primary VLAN 1/10/20 (24576)</text>
    <text x="466" y="192" fill="#57606a">WS-C3560-24TS</text>
  </g>

  <!-- Po1 -->
  <line x1="374" y1="196" x2="374" y2="276" stroke="#bc4c00" stroke-width="3"/>
  <line x1="386" y1="196" x2="386" y2="276" stroke="#bc4c00" stroke-width="3"/>
  <ellipse cx="380" cy="236" rx="16" ry="8" fill="none" stroke="#bc4c00" stroke-width="2"/>
  <text x="398" y="232" font-size="11" font-weight="bold" fill="#bc4c00">Po1 · LACP trunk (Fa0/1-2)</text>
  <!-- T3 marker -->
  <circle cx="352" cy="236" r="13" fill="#9a6700"/><text x="352" y="241" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">T3</text>
  <text x="334" y="232" text-anchor="end" font-size="11" fill="#9a6700">DHCP snooping:</text>
  <text x="334" y="246" text-anchor="end" font-size="11" font-weight="bold" fill="#9a6700">ip dhcp snooping trust here</text>

  <!-- SW1 -->
  <rect x="290" y="276" width="180" height="50" rx="6" fill="#57606a"/>
  <text x="380" y="306" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">SW1 (access)</text>

  <!-- PC1 / PC2 -->
  <g stroke="#57606a" stroke-width="2">
    <line x1="300" y1="326" x2="100" y2="420"/>
    <line x1="320" y1="326" x2="240" y2="420"/>
  </g>
  <g font-size="10" fill="#57606a"><text x="168" y="368" text-anchor="end">Fa0/10 · VLAN 10</text><text x="270" y="392" text-anchor="end">Fa0/20 · VLAN 20</text></g>
  <g fill="#f6f8fa" stroke="#57606a" stroke-width="2"><rect x="70" y="420" width="60" height="34" rx="4"/><rect x="210" y="420" width="60" height="34" rx="4"/></g>
  <g text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2328"><text x="100" y="442">PC1</text><text x="240" y="442">PC2</text></g>
  <g text-anchor="middle" font-size="10" fill="#57606a"><text x="100" y="468">DHCP · VLAN 10</text><text x="240" y="468">DHCP · VLAN 20</text></g>

  <!-- ROGUE-SW -->
  <line x1="420" y1="326" x2="500" y2="420" stroke="#cf222e" stroke-width="3"/>
  <text x="474" y="364" font-size="10" fill="#cf222e">Fa0/12 · VLAN 10</text>
  <circle cx="452" cy="384" r="13" fill="#cf222e"/><text x="452" y="389" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">T1</text>
  <rect x="450" y="420" width="110" height="40" rx="6" fill="#cf222e"/>
  <text x="505" y="445" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">ROGUE-SW</text>
  <g font-size="10" text-anchor="middle">
    <text x="505" y="476" font-weight="bold" fill="#cf222e">STP priority 0 → ROOT (observed)</text>
    <text x="505" y="490" fill="#1f2328">fix: bpduguard / root guard on Fa0/12</text>
  </g>

  <!-- DESK-SW -->
  <line x1="460" y1="326" x2="650" y2="420" stroke="#9a6700" stroke-width="3"/>
  <text x="600" y="368" font-size="10" fill="#9a6700">Fa0/13 · VLAN 10</text>
  <circle cx="560" cy="376" r="13" fill="#9a6700"/><text x="560" y="381" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">T2</text>
  <rect x="600" y="420" width="110" height="40" rx="6" fill="#57606a"/>
  <text x="655" y="445" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">DESK-SW</text>
  <g stroke="#57606a" stroke-width="2"><line x1="630" y1="460" x2="600" y2="530"/><line x1="680" y1="460" x2="710" y2="530"/></g>
  <g fill="#f6f8fa" stroke="#57606a" stroke-width="2"><rect x="570" y="530" width="56" height="32" rx="4"/><rect x="684" y="530" width="56" height="32" rx="4"/></g>
  <g text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2328"><text x="598" y="551">PC3</text><text x="712" y="551">PC4</text></g>
  <g font-size="10" fill="#57606a"><text x="606" y="500" text-anchor="end">Fa0/2</text><text x="702" y="500">Fa0/3</text></g>
  <text x="655" y="580" text-anchor="middle" font-size="10" fill="#1f2328">2 MACs behind one port</text>
  <text x="655" y="594" text-anchor="middle" font-size="10" fill="#9a6700" font-weight="bold">port-security max 1 → err-disabled</text>

  <!-- legend -->
  <rect x="40" y="510" width="470" height="100" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <g font-size="11" fill="#1f2328">
    <text x="56" y="532" font-weight="bold" fill="#cf222e">T1 Rogue root bridge</text>
    <text x="210" y="532">BPDU guard (or root guard) on Fa0/12</text>
    <text x="56" y="554" font-weight="bold" fill="#9a6700">T2 Too many MACs</text>
    <text x="210" y="554">port security on Fa0/13 (max 1, sticky, shutdown)</text>
    <text x="56" y="576" font-weight="bold" fill="#9a6700">T3 Rogue DHCP server</text>
    <text x="210" y="576">DHCP snooping, trust only the uplink Po1</text>
    <text x="56" y="598" fill="#57606a">Only T1's symptom is observed in this export; fixes are guided steps.</text>
  </g>
</svg>
