<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="520" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2328">The "Fake MLAG" Trap</text>
  <text x="380" y="54" text-anchor="middle" font-size="12" fill="#57606a">One port-channel cannot span two independent switches · SW1 and SW2 are not connected to each other</text>

  <!-- panel frames -->
  <rect x="20" y="70" width="350" height="430" rx="8" fill="#fff8f8" stroke="#ffcecb"/>
  <rect x="390" y="70" width="350" height="430" rx="8" fill="#f6fff8" stroke="#aceebb"/>
  <text x="195" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#cf222e">Broken: one Po1 to two switches</text>
  <text x="565" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a7f37">Fixed: one Po per upstream switch</text>

  <!-- ===== Broken panel ===== -->
  <g stroke-width="3">
    <line x1="100" y1="164" x2="172" y2="300" stroke="#cf222e"/><line x1="110" y1="164" x2="182" y2="300" stroke="#cf222e"/>
    <line x1="280" y1="164" x2="208" y2="300" stroke="#8250df"/><line x1="290" y1="164" x2="218" y2="300" stroke="#8250df"/>
  </g>
  <ellipse cx="195" cy="282" rx="44" ry="13" fill="none" stroke="#cf222e" stroke-width="2"/>
  <g font-size="10" fill="#57606a">
    <text x="88" y="236" text-anchor="end">Fa0/1-2</text><text x="236" y="236" text-anchor="end">Fa0/3-4</text>
  </g>
  <text x="70" y="262" font-size="10" fill="#cf222e">frames hashed here</text>
  <text x="70" y="275" font-size="10" fill="#cf222e">→ SW1 dead end</text>
  <circle cx="141" cy="232" r="10" fill="#cf222e"/><path d="M136 227 l10 10 M146 227 l-10 10" stroke="#fff" stroke-width="2"/>
  <g font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <rect x="50" y="122" width="100" height="42" rx="6" fill="#57606a"/><text x="100" y="149">SW1</text>
    <rect x="240" y="122" width="100" height="42" rx="6" fill="#57606a"/><text x="290" y="149">SW2</text>
    <rect x="145" y="300" width="100" height="42" rx="6" fill="#1a7f37"/><text x="195" y="327">SW3</text>
  </g>
  <text x="195" y="356" text-anchor="middle" font-size="11" font-weight="bold" fill="#cf222e">Po1(SU) Fa0/1-4 all (P)</text>
  <g stroke="#57606a" stroke-width="2"><line x1="195" y1="362" x2="195" y2="400"/><line x1="320" y1="164" x2="320" y2="400"/></g>
  <g fill="#f6f8fa" stroke="#57606a" stroke-width="2"><rect x="165" y="400" width="60" height="36" rx="4"/><rect x="290" y="400" width="60" height="36" rx="4"/></g>
  <g text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2328"><text x="195" y="423">PC1</text><text x="320" y="423">PC2</text></g>
  <g text-anchor="middle" font-size="10" fill="#1f2328"><text x="195" y="450">192.168.1.1</text><text x="320" y="450">192.168.1.2</text></g>
  <text x="195" y="482" text-anchor="middle" font-size="12" font-weight="bold" fill="#cf222e">PC2 → PC1 ping: 0/4 (observed)</text>

  <!-- ===== Fixed panel ===== -->
  <g stroke-width="3">
    <line x1="470" y1="164" x2="542" y2="300" stroke="#1a7f37"/><line x1="480" y1="164" x2="552" y2="300" stroke="#1a7f37"/>
    <line x1="650" y1="164" x2="578" y2="300" stroke="#0969da"/><line x1="660" y1="164" x2="588" y2="300" stroke="#0969da"/>
  </g>
  <ellipse cx="511" cy="232" rx="9" ry="15" transform="rotate(-28 511 232)" fill="none" stroke="#1a7f37" stroke-width="2"/>
  <ellipse cx="619" cy="232" rx="9" ry="15" transform="rotate(28 619 232)" fill="none" stroke="#0969da" stroke-width="2"/>
  <g font-size="10">
    <text x="488" y="216" text-anchor="end" fill="#1a7f37">Po1 · Fa0/1-2</text>
    <text x="612" y="216" text-anchor="end" fill="#0969da">Po2 · Fa0/3-4</text>
  </g>
  <g font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <rect x="420" y="122" width="100" height="42" rx="6" fill="#57606a"/><text x="470" y="149">SW1</text>
    <rect x="610" y="122" width="100" height="42" rx="6" fill="#57606a"/><text x="660" y="149">SW2</text>
    <rect x="515" y="300" width="100" height="42" rx="6" fill="#1a7f37"/><text x="565" y="327">SW3</text>
  </g>
  <text x="565" y="356" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a7f37">Po1(SU) + Po2(SU)</text>
  <g stroke="#57606a" stroke-width="2"><line x1="565" y1="362" x2="565" y2="400"/><line x1="690" y1="164" x2="690" y2="400"/></g>
  <g fill="#f6f8fa" stroke="#57606a" stroke-width="2"><rect x="535" y="400" width="60" height="36" rx="4"/><rect x="660" y="400" width="60" height="36" rx="4"/></g>
  <g text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2328"><text x="565" y="423">PC1</text><text x="690" y="423">PC2</text></g>
  <g text-anchor="middle" font-size="10" fill="#1f2328"><text x="565" y="450">192.168.1.1</text><text x="690" y="450">192.168.1.2</text></g>
  <text x="565" y="482" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a7f37">PC2 → PC1 ping: 4/4 (observed)</text>

  <g font-size="10" fill="#57606a">
    <text x="100" y="116" text-anchor="middle">LACP passive</text><text x="290" y="116" text-anchor="middle">LACP passive · PC2 on Fa0/10</text>
    <text x="470" y="116" text-anchor="middle">LACP passive</text><text x="660" y="116" text-anchor="middle">LACP passive · PC2 on Fa0/10</text>
  </g>
</svg>
