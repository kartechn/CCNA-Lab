<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="460" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2328">Inter-Subnet Routing</text>
  <text x="380" y="54" text-anchor="middle" font-size="12" fill="#57606a">One router, two switched LANs, every host uses its own side of R1 as default gateway</text>

  <!-- subnet shading -->
  <rect x="30" y="150" width="330" height="250" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-dasharray="6 4"/>
  <text x="46" y="170" font-size="12" font-weight="bold" fill="#0969da">LAN 1 · 192.168.10.0/24</text>
  <rect x="400" y="150" width="330" height="250" rx="10" fill="#dafbe1" stroke="#4ac26b" stroke-dasharray="6 4"/>
  <text x="714" y="170" text-anchor="end" font-size="12" font-weight="bold" fill="#1a7f37">LAN 2 · 192.168.20.0/24</text>

  <!-- router uplinks -->
  <line x1="350" y1="100" x2="195" y2="200" stroke="#1f2328" stroke-width="3"/>
  <line x1="410" y1="100" x2="565" y2="200" stroke="#1f2328" stroke-width="3"/>
  <g font-size="11" font-weight="bold">
    <text x="300" y="118" text-anchor="end" fill="#0969da">Gi0/0 192.168.10.1</text>
    <text x="460" y="118" fill="#1a7f37">Gi0/1 192.168.20.1</text>
  </g>
  <g font-size="11" fill="#57606a">
    <text x="194" y="190" text-anchor="end">Gi0/1</text>
    <text x="566" y="190">Gi0/1</text>
  </g>

  <!-- R1 -->
  <rect x="320" y="70" width="120" height="50" rx="25" fill="#8250df"/>
  <text x="380" y="101" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">R1</text>
  <text x="380" y="138" text-anchor="middle" font-size="11" fill="#57606a">ISR4331</text>

  <!-- switches -->
  <g font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <rect x="135" y="200" width="120" height="44" rx="6" fill="#57606a"/><text x="195" y="228">SW1</text>
    <rect x="505" y="200" width="120" height="44" rx="6" fill="#57606a"/><text x="565" y="228">SW2</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#57606a">
    <text x="195" y="258">2960 · factory default</text>
    <text x="565" y="258">2960 · factory default</text>
  </g>

  <!-- host links -->
  <g stroke="#57606a" stroke-width="2">
    <line x1="170" y1="244" x2="100" y2="310"/>
    <line x1="220" y1="244" x2="290" y2="310"/>
    <line x1="565" y1="244" x2="565" y2="310"/>
  </g>
  <g font-size="11" fill="#57606a">
    <text x="128" y="282" text-anchor="end">Fa0/1</text>
    <text x="262" y="282">Fa0/2</text>
    <text x="573" y="282">Fa0/1</text>
  </g>

  <!-- hosts -->
  <g fill="#f6f8fa" stroke="#57606a" stroke-width="2">
    <rect x="70" y="310" width="60" height="40" rx="4"/>
    <rect x="260" y="310" width="60" height="40" rx="4"/>
    <rect x="535" y="310" width="60" height="40" rx="4"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">
    <text x="100" y="335">PC1</text><text x="290" y="335">PC2</text><text x="565" y="335">SRV1</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#1f2328">
    <text x="100" y="368">192.168.10.10/24</text><text x="290" y="368">192.168.10.11/24</text><text x="565" y="368">192.168.20.10/24</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#57606a">
    <text x="100" y="384">gw 192.168.10.1</text><text x="290" y="384">gw 192.168.10.1</text><text x="565" y="384">gw 192.168.20.1</text>
  </g>

  <text x="380" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2328">Observed: PC1 → ping 192.168.20.10 · 4/4 replies · TTL 127 (128 − 1 router hop)</text>
</svg>
