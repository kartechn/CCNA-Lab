<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="520" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2328">EtherChannel Troubleshooting</text>
  <text x="380" y="54" text-anchor="middle" font-size="12" fill="#57606a">Three planted faults · observed: Po1(SD) → Po1(SU), PC2 → PC1 ping 0/4 → 4/4</text>

  <!-- Po1 three members -->
  <line x1="260" y1="128" x2="500" y2="128" stroke="#8250df" stroke-width="3"/>
  <line x1="260" y1="140" x2="500" y2="140" stroke="#8250df" stroke-width="3"/>
  <line x1="260" y1="152" x2="500" y2="152" stroke="#8250df" stroke-width="3"/>
  <ellipse cx="300" cy="140" rx="10" ry="22" fill="none" stroke="#8250df" stroke-width="2"/>
  <ellipse cx="460" cy="140" rx="10" ry="22" fill="none" stroke="#8250df" stroke-width="2"/>
  <text x="380" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#8250df">Po1 · LACP trunk · Fa0/1-3 ↔ Fa0/1-3</text>
  <text x="380" y="180" text-anchor="middle" font-size="11" fill="#57606a">fixed: SW1 passive ↔ SW2 active</text>

  <!-- switches -->
  <g font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <rect x="140" y="116" width="120" height="48" rx="6" fill="#57606a"/><text x="200" y="146">SW1</text>
    <rect x="500" y="116" width="120" height="48" rx="6" fill="#57606a"/><text x="560" y="146">SW2</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#57606a">
    <text x="200" y="100">WS-C2960-24TT-L</text><text x="560" y="100">WS-C2960-24TT-L</text>
  </g>

  <!-- fault markers -->
  <g font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <circle cx="380" cy="140" r="11" fill="#cf222e"/><text x="380" y="144">1</text>
    <circle cx="486" cy="152" r="11" fill="#cf222e"/><text x="486" y="156">2</text>
    <circle cx="582" cy="262" r="11" fill="#cf222e"/><text x="582" y="266">3</text>
  </g>

  <!-- PC links -->
  <g stroke="#57606a" stroke-width="2">
    <line x1="200" y1="164" x2="200" y2="320"/><line x1="560" y1="164" x2="560" y2="320"/>
  </g>
  <g font-size="11" fill="#57606a">
    <text x="208" y="262">Fa0/10 · VLAN 30</text><text x="600" y="258">Fa0/10</text><text x="600" y="272">VLAN 31 → 30</text>
  </g>

  <!-- PCs -->
  <g fill="#f6f8fa" stroke="#57606a" stroke-width="2">
    <rect x="170" y="320" width="60" height="40" rx="4"/><rect x="530" y="320" width="60" height="40" rx="4"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">
    <text x="200" y="345">PC1</text><text x="560" y="345">PC2</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#1f2328">
    <text x="200" y="378">192.168.30.1/24</text><text x="560" y="378">192.168.30.2/24</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#57606a">
    <text x="200" y="393">VLAN 30</text><text x="560" y="393">VLAN 30</text>
  </g>

  <!-- fault legend -->
  <rect x="90" y="415" width="580" height="80" rx="6" fill="#fff8f8" stroke="#ffcecb"/>
  <g font-size="11" fill="#1f2328">
    <text x="106" y="437" font-weight="bold" fill="#cf222e">1</text><text x="122" y="437">Both ends LACP passive, so nobody starts negotiation → fix: SW2 Fa0/1-3 mode active</text>
    <text x="106" y="458" font-weight="bold" fill="#cf222e">2</text><text x="122" y="458">SW2 Fa0/3 allowed VLANs 1-20 ≠ other members → fix: switchport trunk allowed vlan all</text>
    <text x="106" y="479" font-weight="bold" fill="#cf222e">3</text><text x="122" y="479">PC2 port in VLAN 31 instead of 30 → fix: switchport access vlan 30</text>
  </g>
</svg>
