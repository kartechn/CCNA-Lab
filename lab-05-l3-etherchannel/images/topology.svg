<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="500" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2328">Layer 3 EtherChannel</text>
  <text x="380" y="54" text-anchor="middle" font-size="12" fill="#57606a">Routed LACP Po1 · 4 members, max-bundle 2 · static routes between the PC subnets</text>

  <!-- Po1 members: Fa0/1-2 active (solid), Fa0/3-4 hot-standby (dashed) -->
  <line x1="260" y1="140" x2="500" y2="140" stroke="#8250df" stroke-width="3"/>
  <line x1="260" y1="150" x2="500" y2="150" stroke="#8250df" stroke-width="3"/>
  <line x1="260" y1="160" x2="500" y2="160" stroke="#8250df" stroke-width="3" stroke-dasharray="7 5" opacity="0.6"/>
  <line x1="260" y1="170" x2="500" y2="170" stroke="#8250df" stroke-width="3" stroke-dasharray="7 5" opacity="0.6"/>
  <ellipse cx="300" cy="155" rx="10" ry="24" fill="none" stroke="#8250df" stroke-width="2"/>
  <ellipse cx="460" cy="155" rx="10" ry="24" fill="none" stroke="#8250df" stroke-width="2"/>
  <text x="380" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#8250df">Po1 · routed LACP · lacp rate fast</text>
  <text x="380" y="132" text-anchor="middle" font-size="11" fill="#8250df">Fa0/1-4 ↔ Fa0/1-4</text>
  <text x="380" y="196" text-anchor="middle" font-size="11" fill="#57606a">solid = bundled (P) · dashed = hot-standby (H)</text>
  <text x="380" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2328">10.0.12.0/30</text>

  <!-- switches -->
  <g font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <rect x="140" y="128" width="120" height="54" rx="6" fill="#0969da"/><text x="200" y="161">DSW1</text>
    <rect x="500" y="128" width="120" height="54" rx="6" fill="#0969da"/><text x="560" y="161">DSW2</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#57606a">
    <text x="200" y="102">WS-C3560-24TS</text><text x="560" y="102">WS-C3560-24TS</text>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2328">
    <text x="200" y="117">Po1 10.0.12.1</text><text x="560" y="117">Po1 10.0.12.2</text>
  </g>

  <!-- PC links -->
  <g stroke="#57606a" stroke-width="2">
    <line x1="200" y1="182" x2="200" y2="330"/><line x1="560" y1="182" x2="560" y2="330"/>
  </g>
  <g font-size="11" fill="#57606a">
    <text x="208" y="250">Fa0/10 (routed)</text><text x="568" y="250">Fa0/10 (routed)</text>
  </g>
  <g font-size="11" font-weight="bold" fill="#1f2328">
    <text x="208" y="266">10.1.1.1/24</text><text x="568" y="266">10.2.2.1/24</text>
  </g>

  <!-- PCs -->
  <g fill="#f6f8fa" stroke="#57606a" stroke-width="2">
    <rect x="170" y="330" width="60" height="40" rx="4"/><rect x="530" y="330" width="60" height="40" rx="4"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">
    <text x="200" y="355">PC1</text><text x="560" y="355">PC2</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#1f2328">
    <text x="200" y="388">10.1.1.10/24</text><text x="560" y="388">10.2.2.10/24</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#57606a">
    <text x="200" y="403">gw 10.1.1.1</text><text x="560" y="403">gw 10.2.2.1</text>
  </g>

  <text x="380" y="450" text-anchor="middle" font-size="11" fill="#57606a">DSW1: ip route 10.2.2.0/24 via 10.0.12.2 · DSW2: ip route 10.1.1.0/24 via 10.0.12.1</text>
  <text x="380" y="470" text-anchor="middle" font-size="11" fill="#57606a">A routed port-channel has no STP blocking: all bundled links carry traffic</text>
</svg>
