<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="460" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2328">Troubleshooting: Six Faults</text>
  <text x="380" y="54" text-anchor="middle" font-size="12" fill="#57606a">Solved build · numbered markers show where the six suggested faults go</text>

  <!-- zones -->
  <rect x="30" y="80" width="250" height="290" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-dasharray="6 4"/>
  <text x="46" y="100" font-size="12" font-weight="bold" fill="#0969da">LAN 1 · 192.168.1.0/24 · VLAN 10</text>
  <rect x="300" y="80" width="240" height="290" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-dasharray="6 4"/>
  <text x="420" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a6700">OSPF area 0 · 10.0.12.0/30</text>
  <rect x="560" y="80" width="170" height="290" rx="10" fill="#dafbe1" stroke="#4ac26b" stroke-dasharray="6 4"/>
  <text x="714" y="100" text-anchor="end" font-size="12" font-weight="bold" fill="#1a7f37">LAN 2 · 192.168.2.0/24</text>

  <!-- links -->
  <g stroke="#1f2328" stroke-width="3">
    <line x1="155" y1="182" x2="155" y2="248"/>
    <line x1="215" y1="270" x2="320" y2="270"/>
    <line x1="590" y1="270" x2="640" y2="270"/>
  </g>
  <line x1="440" y1="270" x2="470" y2="270" stroke="#bc4c00" stroke-width="3"/>

  <!-- devices -->
  <rect x="95" y="248" width="120" height="44" rx="6" fill="#57606a"/>
  <text x="155" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">SW1</text>
  <rect x="320" y="245" width="120" height="50" rx="25" fill="#8250df"/>
  <text x="380" y="276" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">R1</text>
  <rect x="470" y="245" width="120" height="50" rx="25" fill="#8250df"/>
  <text x="530" y="276" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">R2</text>
  <g fill="#f6f8fa" stroke="#57606a" stroke-width="2">
    <rect x="125" y="146" width="60" height="36" rx="4"/>
    <rect x="640" y="252" width="60" height="36" rx="4"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">
    <text x="155" y="169">PC1</text><text x="670" y="275">PC2</text>
  </g>

  <!-- labels -->
  <g font-size="11" fill="#1f2328" text-anchor="middle">
    <text x="155" y="128">192.168.1.10/24 · gw .1</text>
    <text x="645" y="310">192.168.2.10/24</text>
    <text x="645" y="324">gw 192.168.2.1</text>
  </g>
  <g font-size="11" fill="#57606a">
    <text x="163" y="220">Fa0/1 · VLAN 10</text>
    <text x="222" y="260">Gi0/1 · VLAN 10</text>
  </g>
  <g font-size="10" fill="#57606a" text-anchor="middle">
    <text x="380" y="219">Gi0/0 192.168.1.1</text>
    <text x="380" y="233">Gi0/1 10.0.12.1</text>
    <text x="380" y="312">RID 1.1.1.1</text>
    <text x="530" y="219">Gi0/1 10.0.12.2</text>
    <text x="530" y="233">Gi0/0 192.168.2.1</text>
    <text x="530" y="312">RID 2.2.2.2</text>
    <text x="455" y="340">LANs passive in OSPF</text>
  </g>

  <!-- fault markers -->
  <g font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <circle cx="275" cy="270" r="10" fill="#cf222e"/><text x="275" y="274">1</text>
    <circle cx="105" cy="146" r="10" fill="#cf222e"/><text x="105" y="150">2</text>
    <circle cx="430" cy="245" r="10" fill="#cf222e"/><text x="430" y="249">3</text>
    <circle cx="430" cy="295" r="10" fill="#cf222e"/><text x="430" y="299">4</text>
    <circle cx="480" cy="295" r="10" fill="#cf222e"/><text x="480" y="299">5</text>
    <circle cx="580" cy="245" r="10" fill="#cf222e"/><text x="580" y="249">6</text>
  </g>

  <!-- legend -->
  <g font-size="11" font-weight="bold" fill="#cf222e">
    <text x="40" y="398">1</text><text x="40" y="416">2</text>
    <text x="280" y="398">3</text><text x="280" y="416">4</text>
    <text x="520" y="398">5</text><text x="520" y="416">6</text>
  </g>
  <g font-size="11" fill="#1f2328">
    <text x="54" y="398">SW1 Gi0/1 in the wrong VLAN</text>
    <text x="54" y="416">PC1 wrong default gateway</text>
    <text x="294" y="398">R1 Gi0/1 shut down</text>
    <text x="294" y="416">R1 Gi0/1 OSPF hello 5 s</text>
    <text x="534" y="398">R2 transit link passive</text>
    <text x="534" y="416">R2 LAN not advertised</text>
  </g>
  <text x="380" y="446" text-anchor="middle" font-size="11" fill="#57606a">Faults are suggestions for practice, not the original six · Observed after fixing: PC1 → PC2 4/4, TTL 126</text>
</svg>
