<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="560" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2328">Router-on-a-Stick over EtherChannel</text>
  <text x="380" y="54" text-anchor="middle" font-size="12" fill="#57606a">Observed: Po1(SU), Po1 trunking VLANs 1,10,20 · PC2 → PC1 ping 4/4, TTL 127</text>

  <!-- R1 -->
  <rect x="140" y="92" width="120" height="48" rx="24" fill="#8250df"/>
  <text x="200" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">R1</text>
  <text x="276" y="104" font-size="11" fill="#57606a">ISR4331</text>
  <text x="276" y="120" font-size="11" font-weight="bold" fill="#1f2328">Gi0/0.10 192.168.10.1/24 (dot1Q 10)</text>
  <text x="276" y="136" font-size="11" font-weight="bold" fill="#1f2328">Gi0/0.20 192.168.20.1/24 (dot1Q 20)</text>

  <!-- R1-SW1 trunk -->
  <line x1="200" y1="140" x2="200" y2="288" stroke="#1a7f37" stroke-width="4"/>
  <text x="208" y="200" font-size="12" font-weight="bold" fill="#1a7f37">802.1Q trunk</text>
  <text x="208" y="216" font-size="11" fill="#1a7f37">R1 Gi0/0 ↔ SW1 Gi0/1</text>
  <text x="208" y="232" font-size="11" fill="#57606a">(single link: all routed traffic)</text>

  <!-- Po1 SW1-SW2 -->
  <line x1="260" y1="304" x2="500" y2="304" stroke="#bc4c00" stroke-width="3"/>
  <line x1="260" y1="316" x2="500" y2="316" stroke="#bc4c00" stroke-width="3"/>
  <ellipse cx="300" cy="310" rx="9" ry="16" fill="none" stroke="#bc4c00" stroke-width="2"/>
  <ellipse cx="460" cy="310" rx="9" ry="16" fill="none" stroke="#bc4c00" stroke-width="2"/>
  <text x="380" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#bc4c00">Po1 · LACP trunk · VLANs 10, 20</text>
  <text x="380" y="338" text-anchor="middle" font-size="11" fill="#bc4c00">SW1 Fa0/1-2 (active) ↔ SW2 Fa0/1-2 (passive)</text>

  <!-- switches -->
  <g font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <rect x="140" y="288" width="120" height="44" rx="6" fill="#57606a"/><text x="200" y="316">SW1</text>
    <rect x="500" y="288" width="120" height="44" rx="6" fill="#57606a"/><text x="560" y="316">SW2</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#57606a">
    <text x="200" y="352">WS-C2960-24TT-L</text><text x="560" y="352">WS-C2960-24TT-L</text>
  </g>

  <!-- PC links -->
  <g stroke="#57606a" stroke-width="2">
    <line x1="200" y1="358" x2="200" y2="420"/><line x1="560" y1="358" x2="560" y2="420"/>
  </g>
  <g font-size="11" fill="#57606a">
    <text x="208" y="394">Fa0/10 · VLAN 10</text><text x="568" y="394">Fa0/20 · VLAN 20</text>
  </g>

  <!-- PCs -->
  <g fill="#f6f8fa" stroke="#57606a" stroke-width="2">
    <rect x="170" y="420" width="60" height="40" rx="4"/><rect x="530" y="420" width="60" height="40" rx="4"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">
    <text x="200" y="445">PC1</text><text x="560" y="445">PC2</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#1f2328">
    <text x="200" y="478">192.168.10.10/24</text><text x="560" y="478">192.168.20.10/24</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#57606a">
    <text x="200" y="493">gw 192.168.10.1</text><text x="560" y="493">gw 192.168.20.1</text>
  </g>

  <text x="380" y="535" text-anchor="middle" font-size="11" fill="#57606a">PC2 → PC1: SW2 → Po1 → SW1 → Gi0/1 → R1 (.20 → .10) → Gi0/1 → SW1 → PC1</text>
</svg>
