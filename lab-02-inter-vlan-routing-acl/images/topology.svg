<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="520" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2328">Inter-VLAN Routing and ACL-Based VLAN Isolation</text>

  <!-- links -->
  <line x1="380" y1="178" x2="380" y2="375" stroke="#8250df" stroke-width="4"/>
  <text x="392" y="262" font-size="12" font-weight="bold" fill="#8250df">802.1Q trunk</text>
  <text x="392" y="278" font-size="12" fill="#8250df">DSW1 Gi0/1 ↔ SW1 Fa0/1</text>
  <line x1="130" y1="318" x2="335" y2="378" stroke="#1a7f37" stroke-width="3"/>
  <line x1="630" y1="318" x2="425" y2="378" stroke="#0969da" stroke-width="3"/>
  <text x="225" y="372" text-anchor="end" font-size="12" fill="#1a7f37">PC2 Fa0 ↔ SW1 Gi0/1</text>
  <text x="535" y="372" font-size="12" fill="#0969da">SW1 Gi0/2 ↔ PC1 Fa0</text>

  <!-- DSW1 -->
  <rect x="300" y="78" width="160" height="100" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="2"/>
  <rect x="325" y="92" width="110" height="34" rx="5" fill="#8250df"/>
  <text x="380" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">DSW1</text>
  <text x="380" y="144" text-anchor="middle" font-size="11" fill="#57606a">WS-C3560-24TS · ip routing</text>
  <text x="380" y="160" text-anchor="middle" font-size="11" fill="#0969da">Vlan10 192.168.10.1 · ACL in</text>
  <text x="380" y="174" text-anchor="middle" font-size="11" fill="#1a7f37">Vlan20 192.168.20.1 · ACL in</text>

  <!-- SW1 -->
  <rect x="320" y="375" width="120" height="44" rx="6" fill="#57606a"/>
  <path d="M345 390 h30 l-6 -5 M375 390 l-6 5 M415 404 h-30 l6 -5 M385 404 l6 5" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="380" y="440" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2328">SW1</text>
  <text x="380" y="458" text-anchor="middle" font-size="12" fill="#57606a">WS-C2960-24TT-L</text>

  <!-- PC2 (VLAN 20) -->
  <text x="130" y="218" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2328">PC2</text>
  <rect x="98" y="226" width="64" height="44" rx="4" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
  <rect x="120" y="270" width="20" height="8" fill="#1a7f37"/>
  <text x="130" y="296" text-anchor="middle" font-size="12" fill="#1f2328">192.168.20.10/24 · gw .20.1</text>
  <text x="130" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a7f37">VLAN 20 (crew)</text>

  <!-- PC1 (VLAN 10) -->
  <text x="630" y="218" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2328">PC1</text>
  <rect x="598" y="226" width="64" height="44" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <rect x="620" y="270" width="20" height="8" fill="#0969da"/>
  <text x="630" y="296" text-anchor="middle" font-size="12" fill="#1f2328">192.168.10.10/24 · gw .10.1</text>
  <text x="630" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#0969da">VLAN 10 (Buss)</text>

  <text x="380" y="498" text-anchor="middle" font-size="11" fill="#57606a">DSW1 routes between the VLANs, but ACLs deny VLAN 10 ↔ VLAN 20 traffic</text>
</svg>
