<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" viewBox="0 0 760 580" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="580" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2328">DHCP Relay over EtherChannel</text>
  <text x="380" y="54" text-anchor="middle" font-size="12" fill="#57606a">R1 is the DHCP server · DSW1 relays with ip helper-address · observed: both PCs leased .10</text>

  <!-- R1 -->
  <rect x="320" y="76" width="120" height="46" rx="23" fill="#8250df"/>
  <text x="380" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">R1</text>
  <g font-size="11" fill="#1f2328">
    <text x="456" y="86" font-weight="bold">DHCP server · ISR4331</text>
    <text x="456" y="100">pool VLAN10 192.168.10.0/24 gw .1</text>
    <text x="456" y="114">pool VLAN20 192.168.20.0/24 gw .1</text>
    <text x="456" y="128">excluded .1 – .9 in both</text>
  </g>
  <g font-size="11" fill="#57606a">
    <text x="304" y="90" text-anchor="end">ip route 192.168.10.0/24 → 10.0.0.2</text>
    <text x="304" y="104" text-anchor="end">ip route 192.168.20.0/24 → 10.0.0.2</text>
  </g>

  <!-- R1 - DSW1 routed link -->
  <line x1="380" y1="122" x2="380" y2="206" stroke="#1f2328" stroke-width="4"/>
  <text x="390" y="152" font-size="11" font-weight="bold" fill="#1f2328">routed · 10.0.0.0/30</text>
  <text x="390" y="166" font-size="11" fill="#57606a">R1 Gi0/0 .1 ↔ DSW1 Gi0/1 .2</text>
  <text x="370" y="182" text-anchor="end" font-size="11" fill="#bc4c00">unicast to 10.0.0.1 ↑</text>
  <text x="370" y="196" text-anchor="end" font-size="11" fill="#bc4c00">(giaddr = SVI IP)</text>

  <!-- DSW1 -->
  <rect x="300" y="206" width="160" height="56" rx="6" fill="#0969da"/>
  <text x="380" y="232" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">DSW1</text>
  <text x="380" y="250" text-anchor="middle" font-size="11" fill="#ffffff">relay agent · ip routing</text>
  <g font-size="11" fill="#1f2328">
    <text x="476" y="220" font-weight="bold">WS-C3560-24TS</text>
    <text x="476" y="234">Vlan10 192.168.10.1 · helper 10.0.0.1</text>
    <text x="476" y="248">Vlan20 192.168.20.1 · helper 10.0.0.1</text>
    <text x="476" y="262">default route → 10.0.0.1</text>
  </g>

  <!-- Po1 -->
  <line x1="374" y1="262" x2="374" y2="366" stroke="#bc4c00" stroke-width="3"/>
  <line x1="386" y1="262" x2="386" y2="366" stroke="#bc4c00" stroke-width="3"/>
  <ellipse cx="380" cy="314" rx="16" ry="9" fill="none" stroke="#bc4c00" stroke-width="2"/>
  <text x="398" y="300" font-size="12" font-weight="bold" fill="#bc4c00">Po1 · LACP trunk · VLANs 10, 20</text>
  <text x="398" y="316" font-size="11" fill="#bc4c00">DSW1 Fa0/1-2 (active) ↔ SW1 Fa0/1-2 (passive)</text>
  <text x="362" y="300" text-anchor="end" font-size="11" fill="#bc4c00">DHCP Discover</text>
  <text x="362" y="314" text-anchor="end" font-size="11" fill="#bc4c00">broadcast ↑</text>

  <!-- SW1 -->
  <rect x="320" y="366" width="120" height="46" rx="6" fill="#57606a"/>
  <text x="380" y="395" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">SW1</text>
  <text x="456" y="394" font-size="11" fill="#57606a">WS-C2960-24TT-L</text>

  <!-- PCs -->
  <g stroke="#57606a" stroke-width="2"><line x1="340" y1="412" x2="220" y2="470"/><line x1="420" y1="412" x2="540" y2="470"/></g>
  <g font-size="11" fill="#57606a"><text x="262" y="438" text-anchor="end">Fa0/10 · VLAN 10</text><text x="498" y="438">Fa0/20 · VLAN 20</text></g>
  <g fill="#f6f8fa" stroke="#57606a" stroke-width="2"><rect x="190" y="470" width="60" height="40" rx="4"/><rect x="510" y="470" width="60" height="40" rx="4"/></g>
  <g text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328"><text x="220" y="495">PC1</text><text x="540" y="495">PC2</text></g>
  <g text-anchor="middle" font-size="11" font-weight="bold" fill="#1a7f37"><text x="220" y="528">DHCP → 192.168.10.10</text><text x="540" y="528">DHCP → 192.168.20.10</text></g>
  <g text-anchor="middle" font-size="11" fill="#57606a"><text x="220" y="543">gw 192.168.10.1</text><text x="540" y="543">gw 192.168.20.1</text></g>

  <text x="380" y="568" text-anchor="middle" font-size="11" fill="#57606a">.10 is the first free address after the .1 – .9 exclusion · PC2 → PC1 ping 4/4, TTL 127 (observed)</text>
</svg>
