<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="500" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2328">STP Root Bridge + PortFast and BPDU Guard</text>
  <text x="380" y="54" text-anchor="middle" font-size="12" fill="#57606a">Rapid-PVST+ VLAN 1 · SW3 roles observed, SW1/SW2 roles expected</text>

  <!-- links -->
  <g stroke="#8250df" stroke-width="4">
    <line x1="350" y1="125" x2="190" y2="285"/>
    <line x1="410" y1="125" x2="570" y2="285"/>
    <line x1="250" y1="307" x2="510" y2="307"/>
  </g>
  <g font-size="11" fill="#8250df">
    <text x="232" y="190" text-anchor="end">SW1 Gi0/1 ↔ SW2 Gi0/1</text>
    <text x="528" y="190">SW1 Gi0/2 ↔ SW3 Gi0/2</text>
    <text x="380" y="330" text-anchor="middle">SW2 Gi0/2 ↔ SW3 Gi0/1</text>
  </g>

  <!-- port roles -->
  <g font-size="11" font-weight="bold">
    <text x="318" y="140" text-anchor="end" fill="#57606a">DP</text>
    <text x="442" y="140" fill="#57606a">DP</text>
    <text x="226" y="272" fill="#1a7f37">RP</text>
    <text x="534" y="272" text-anchor="end" fill="#1a7f37">RP</text>
    <text x="262" y="298" fill="#57606a">DP</text>
  </g>

  <!-- blocked port marker at SW3 Gi0/1 -->
  <circle cx="496" cy="307" r="11" fill="#cf222e"/>
  <path d="M490 301 l12 12 M502 301 l-12 12" stroke="#ffffff" stroke-width="2.5"/>
  <text x="480" y="294" text-anchor="end" font-size="11" font-weight="bold" fill="#cf222e">SW3 Gi0/1 Altn BLK</text>

  <!-- switches -->
  <g font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <rect x="320" y="81" width="120" height="44" rx="6" fill="#1a7f37"/><text x="380" y="109">SW1</text>
    <rect x="130" y="285" width="120" height="44" rx="6" fill="#0969da"/><text x="190" y="313">SW2</text>
    <rect x="510" y="285" width="120" height="44" rx="6" fill="#57606a"/><text x="570" y="313">SW3</text>
  </g>
  <g font-size="11" text-anchor="middle">
    <text x="452" y="98" text-anchor="start" font-weight="bold" fill="#1a7f37">Root bridge</text>
    <text x="452" y="113" text-anchor="start" fill="#57606a">root primary · 24576</text>
    <text x="190" y="350" font-weight="bold" fill="#0969da">Backup root</text>
    <text x="190" y="365" fill="#57606a">root secondary · 28672</text>
    <text x="570" y="350" font-weight="bold" fill="#57606a">Default priority</text>
    <text x="570" y="365" fill="#57606a">32768 · root cost 4</text>
  </g>

  <!-- PC links -->
  <g stroke="#57606a" stroke-width="2">
    <line x1="190" y1="370" x2="190" y2="410"/>
    <line x1="570" y1="370" x2="570" y2="410"/>
  </g>
  <g font-size="11" fill="#57606a">
    <text x="198" y="396">Fa0/1 · PortFast + BPDU guard</text>
    <text x="562" y="396" text-anchor="end">PortFast + BPDU guard · Fa0/1</text>
  </g>

  <!-- PCs -->
  <g fill="#f6f8fa" stroke="#57606a" stroke-width="2">
    <rect x="160" y="410" width="60" height="36" rx="4"/>
    <rect x="540" y="410" width="60" height="36" rx="4"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">
    <text x="190" y="433">PC1</text><text x="570" y="433">PC2</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#1f2328">
    <text x="190" y="462">192.168.1.10/24</text><text x="570" y="462">192.168.1.20/24</text>
  </g>

  <text x="380" y="488" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2328">Observed: PC2 → ping 192.168.1.10 · 3/4 replies (first lost) · path SW3 → SW1 → SW2</text>
</svg>
