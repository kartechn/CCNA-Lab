<svg xmlns="http://www.w3.org/2000/svg" width="760" height="720" viewBox="0 0 760 720" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="720" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2328">Capstone: Enterprise Campus + Branch</text>
  <text x="380" y="51" text-anchor="middle" font-size="12" fill="#57606a">NAT/PAT · DHCP relay · OSPF area 0 + 1 · LACP · HSRP (MD5, tracking) · Rapid-PVST · L2 security · ROAS · ACL</text>

  <!-- OSPF areas -->
  <rect x="40" y="196" width="460" height="128" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-dasharray="6 4"/>
  <text x="52" y="214" font-size="11" font-weight="bold" fill="#0969da">OSPF area 0 (campus)</text>
  <rect x="530" y="196" width="200" height="128" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-dasharray="6 4"/>
  <text x="542" y="214" font-size="11" font-weight="bold" fill="#7d4e00">OSPF area 1 (branch)</text>

  <!-- ISP -->
  <rect x="320" y="66" width="120" height="38" rx="19" fill="#57606a"/>
  <text x="380" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">ISP</text>
  <text x="456" y="82" font-size="11" fill="#1f2328">Lo0 8.8.8.8 · no private routes</text>
  <text x="456" y="96" font-size="11" fill="#57606a">203.0.113.1/30</text>
  <line x1="380" y1="104" x2="380" y2="138" stroke="#1f2328" stroke-width="3"/>
  <text x="390" y="125" font-size="10" fill="#cf222e">NAT outside</text>

  <!-- EDGE -->
  <rect x="310" y="138" width="140" height="44" rx="8" fill="#8250df"/>
  <text x="380" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">EDGE (ABR)</text>
  <g font-size="10" fill="#1f2328">
    <text x="466" y="150">PAT overload on Gi0/0 · DHCP server (4 pools)</text>
    <text x="466" y="163">OSPF RID 1.1.1.1 · default-information originate</text>
    <text x="466" y="176" fill="#57606a">203.0.113.2 · Gi0/1-3 NAT inside</text>
  </g>

  <!-- EDGE to DSW1/DSW2/BR1 -->
  <g stroke="#1f2328" stroke-width="3">
    <line x1="330" y1="182" x2="160" y2="250"/>
    <line x1="380" y1="182" x2="400" y2="250"/>
    <line x1="430" y1="182" x2="630" y2="250"/>
  </g>
  <g font-size="10" fill="#57606a">
    <text x="226" y="206" text-anchor="end">10.0.1.0/30</text>
    <text x="396" y="226" text-anchor="end">10.0.2.0/30</text>
    <text x="520" y="190">10.0.3.0/30</text>
  </g>

  <!-- cores -->
  <rect x="100" y="250" width="120" height="46" rx="6" fill="#1a7f37"/>
  <text x="160" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">DSW1</text>
  <rect x="340" y="250" width="120" height="46" rx="6" fill="#0969da"/>
  <text x="400" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">DSW2</text>
  <line x1="220" y1="268" x2="340" y2="268" stroke="#bc4c00" stroke-width="3"/>
  <line x1="220" y1="278" x2="340" y2="278" stroke="#bc4c00" stroke-width="3"/>
  <text x="280" y="262" text-anchor="middle" font-size="10" font-weight="bold" fill="#bc4c00">Po1 LACP</text>
  <text x="280" y="292" text-anchor="middle" font-size="9" fill="#bc4c00">native 99</text>
  <g font-size="10">
    <text x="160" y="312" text-anchor="middle" font-weight="bold" fill="#1a7f37">VLAN 10 Active/root · RID 2.2.2.2</text>
    <text x="400" y="312" text-anchor="middle" font-weight="bold" fill="#0969da">VLAN 20 Active/root · RID 3.3.3.3</text>
  </g>

  <!-- BR1 -->
  <rect x="570" y="250" width="120" height="46" rx="23" fill="#9a6700"/>
  <text x="630" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">BR1</text>
  <text x="630" y="312" text-anchor="middle" font-size="10" fill="#1f2328">ROAS .30 / .40 · RID 4.4.4.4</text>

  <!-- access trunks (dual-homed) -->
  <g stroke="#8250df" stroke-width="3">
    <line x1="160" y1="326" x2="160" y2="400"/>
    <line x1="400" y1="326" x2="400" y2="400"/>
    <line x1="190" y1="326" x2="380" y2="400"/>
    <line x1="370" y1="326" x2="180" y2="400"/>
  </g>
  <rect x="190" y="352" width="180" height="16" rx="3" fill="#ffffff" opacity="0.95"/>
  <text x="280" y="364" text-anchor="middle" font-size="10" fill="#8250df">trunks · native 99 · allowed 10,20,99</text>

  <!-- branch trunk -->
  <line x1="630" y1="326" x2="630" y2="400" stroke="#9a6700" stroke-width="3"/>
  <text x="640" y="368" font-size="10" fill="#9a6700">Gi0/1 trunk 30,40</text>

  <!-- access switches -->
  <g font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <rect x="100" y="400" width="120" height="42" rx="6" fill="#57606a"/><text x="160" y="426">ACC1</text>
    <rect x="340" y="400" width="120" height="42" rx="6" fill="#57606a"/><text x="400" y="426">ACC2</text>
    <rect x="570" y="400" width="120" height="42" rx="6" fill="#57606a"/><text x="630" y="426">BSW1</text>
  </g>
  <text x="280" y="458" text-anchor="middle" font-size="10" fill="#57606a">DHCP snooping (trust uplinks) · port-security sticky · BPDU guard · unused ports VLAN 999 shut</text>

  <!-- hosts -->
  <g stroke="#57606a" stroke-width="2">
    <line x1="140" y1="442" x2="100" y2="490"/><line x1="180" y1="442" x2="220" y2="490"/>
    <line x1="400" y1="442" x2="400" y2="490"/>
    <line x1="610" y1="442" x2="580" y2="490"/><line x1="650" y1="442" x2="690" y2="490"/>
  </g>
  <g fill="#f6f8fa" stroke="#57606a" stroke-width="2">
    <rect x="70" y="490" width="60" height="32" rx="4"/><rect x="190" y="490" width="60" height="32" rx="4"/>
    <rect x="370" y="490" width="60" height="32" rx="4"/>
    <rect x="550" y="490" width="60" height="32" rx="4"/><rect x="660" y="490" width="60" height="32" rx="4"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2328">
    <text x="100" y="511">PC1</text><text x="220" y="511">SRV1</text><text x="400" y="511">PC2</text><text x="580" y="511">PC3</text><text x="690" y="511">PC4</text>
  </g>
  <g text-anchor="middle" font-size="9" fill="#57606a">
    <text x="100" y="536">VLAN 10 · DHCP</text><text x="220" y="536">VLAN 20 · .20.100</text><text x="400" y="536">VLAN 20 · DHCP</text>
    <text x="580" y="536">VLAN 30 staff</text><text x="690" y="536">VLAN 40 guest</text>
  </g>

  <!-- results -->
  <rect x="40" y="556" width="680" height="148" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="56" y="578" font-size="12" font-weight="bold" fill="#1f2328">Observed tests</text>
  <g font-size="11" fill="#1f2328">
    <text x="56" y="600">PC1 → 8.8.8.8</text><text x="250" y="600" fill="#1a7f37" font-weight="bold">4/4 · TTL 253</text><text x="370" y="600" fill="#57606a">core → EDGE (PAT) → ISP</text>
    <text x="56" y="620">PC1 → SRV1 192.168.20.100</text><text x="250" y="620" fill="#1a7f37" font-weight="bold">4/4 · TTL 127</text><text x="370" y="620" fill="#57606a">inter-VLAN on the core</text>
    <text x="56" y="640">PC1 → PC3 172.16.30.10</text><text x="250" y="640" fill="#1a7f37" font-weight="bold">4/4 · TTL 125</text><text x="370" y="640" fill="#57606a">core → EDGE → BR1 (area 0 → 1)</text>
    <text x="56" y="660">PC4 guest → 8.8.8.8</text><text x="250" y="660" fill="#1a7f37" font-weight="bold">4/4 · TTL 253</text><text x="370" y="660" fill="#57606a">BR1 → EDGE (PAT) → ISP</text>
    <text x="56" y="680">PC4 guest → PC1</text><text x="250" y="680" fill="#cf222e" font-weight="bold">blocked</text><text x="370" y="680" fill="#57606a">GUEST-ISOLATION ACL on BR1 Gi0/1.40</text>
  </g>
</svg>
